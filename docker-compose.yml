# Sizzle — self-hosted cookbook. Install and upgrade: docs/self-hosting.md
#   docker compose up -d                          # then open http://<your-server>:3000
#   docker compose pull && docker compose up -d   # upgrade to the newest release
services:
  sizzle:
    # Set SIZZLE_VERSION in .env to pin a release (e.g. 0.0.1); latest follows every release.
    # To build from a checkout instead: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/leemac/sizzle:${SIZZLE_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${SIZZLE_PORT:-3000}:80"
    env_file: .env
    volumes:
      # Databases, imported photos and the generated secret key live here. Back it up.
      - sizzle-storage:/rails/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /rails/tmp:uid=1000,gid=1000,mode=0755
      - /tmp:mode=1777

volumes:
  sizzle-storage:
