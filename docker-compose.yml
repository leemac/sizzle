# Sizzle — self-hosted cookbook.
#   cp .env.example .env   # set ANTHROPIC_API_KEY and SIZZLE_API_TOKEN
#   docker compose up -d   # first start builds the image (a few minutes), then open http://<your-server>:3000
services:
  sizzle:
    # Built from source until release images are published to ghcr.io.
    build: .
    restart: unless-stopped
    ports:
      - "${SIZZLE_PORT:-3000}:80"
    env_file: .env
    volumes:
      # Databases, imported photos and the generated secret key live here. Back it up.
      - sizzle-storage:/rails/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /rails/tmp:uid=1000,gid=1000,mode=0755
      - /tmp:mode=1777

volumes:
  sizzle-storage:
