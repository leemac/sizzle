name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs all of CI on the tagged commit before publishing.
  workflow_call:

# Least privilege: CI only reads the repo. Nothing here can push, comment or publish.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only changes (Markdown anywhere, or anything under docs/) skip the slow jobs below.
  # Skipped jobs still satisfy the required checks; the secret scan always runs.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Only pull requests and pushes to main may skip. Releases (a tag push calling this
          # workflow) and anything that can't be diffed run every job.
          case "$EVENT:$REF" in
            pull_request:*) base=HEAD^1 ;; # the checkout is the PR merged into its base
            push:refs/heads/main) base=$BEFORE ;;
            *) base= ;;
          esac
          code=true
          # --no-renames lists both sides of a rename, so moving code into docs/ still counts.
          if [[ -n "$base" ]] && files=$(git diff --no-renames --name-only "$base" HEAD) && [[ -n "$files" ]]; then
            echo "$files"
            grep -qvE '\.md$|^docs/' <<< "$files" || code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  test:
    name: Rails tests
    needs: changes
    # Runs unless the change is docs-only; if detection fails, it runs anyway.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # Ruby 3.3.6 has a prebuilt binary for 24.04, but not newer Ubuntu images.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: bin/rails db:test:prepare test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  frontend:
    name: Frontend checks
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  security:
    name: Lint and security scans
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: RuboCop
        run: bin/rubocop
      - name: Brakeman (Rails static analysis)
        run: bin/brakeman --no-pager --exit-on-warn
      - name: bundler-audit (known-vulnerable gems)
        run: bin/bundler-audit check --update
      - name: npm audit (known-vulnerable packages)
        run: npm audit --audit-level=high --omit=dev

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit, not just the tip: a secret deleted in a later commit is still published.
          fetch-depth: 0
      - name: Install gitleaks (version and checksums pinned in bin/gitleaks)
        run: bin/gitleaks version
      - name: gitleaks (API keys and tokens in any commit)
        run: bin/secret-scan

  docker:
    name: Docker image boots
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose files are valid, for release installs and source builds
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet
      - run: docker build --build-arg SIZZLE_VERSION=0.0.0-ci -t sizzle:ci .
      - name: Boot with the same hardening as docker-compose.yml and hit /up
        run: |
          docker run -d --name sizzle -p 3000:80 --read-only --tmpfs /rails/tmp:uid=1000,gid=1000,mode=0755 --tmpfs /tmp:mode=1777 \
            -v sizzle-storage:/rails/storage --security-opt no-new-privileges:true sizzle:ci
          for _ in $(seq 1 30); do
            # /up proves Rails booted; / proves the database was prepared and the gallery renders.
            if curl -fsS http://localhost:3000/up && curl -fsS -o /dev/null http://localhost:3000/; then
              # The version passed at build time is what Setup reports.
              curl -fsS http://localhost:3000/setup | grep -q '0\.0\.0-ci' && exit 0
              echo "Setup does not report the build's version"
              break
            fi
            sleep 2
          done
          docker logs sizzle
          exit 1
