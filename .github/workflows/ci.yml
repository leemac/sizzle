name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the repo. Nothing here can push, comment or publish.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rails tests
    # Ruby 3.3.6 has a prebuilt binary for 24.04, but not newer Ubuntu images.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: bin/rails db:test:prepare test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  security:
    name: Lint and security scans
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: RuboCop
        run: bin/rubocop
      - name: Brakeman (Rails static analysis)
        run: bin/brakeman --no-pager --exit-on-warn
      - name: bundler-audit (known-vulnerable gems)
        run: bin/bundler-audit check --update
      - name: npm audit (known-vulnerable packages)
        run: npm audit --audit-level=high --omit=dev

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit, not just the tip: a secret deleted in a later commit is still published.
          fetch-depth: 0
      - name: Install gitleaks (pinned and checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: gitleaks (API keys and tokens in any commit)
        run: bin/secret-scan

  docker:
    name: Docker image boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t sizzle:ci .
      - name: Boot with the same hardening as docker-compose.yml and hit /up
        run: |
          docker run -d --name sizzle -p 3000:80 --read-only --tmpfs /rails/tmp:uid=1000,gid=1000,mode=0755 --tmpfs /tmp:mode=1777 \
            -v sizzle-storage:/rails/storage --security-opt no-new-privileges:true sizzle:ci
          for i in $(seq 1 30); do
            # /up proves Rails booted; / proves the database was prepared and the gallery renders.
            curl -fsS http://localhost:3000/up && curl -fsS -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          docker logs sizzle
          exit 1
