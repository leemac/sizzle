version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule: { interval: weekly }
    groups:
      rails: { patterns: ["rails", "action*", "active*", "railties"] }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      frontend: { patterns: ["*"], update-types: ["minor", "patch"] }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      # init and analyze must run the same version, or CodeQL fails.
      codeql: { patterns: ["github/codeql-action/*"] }
  # Explicit FROM tags/digests cover runtime upgrades and rebuilt Debian base images.
  # Ruby updates also need .ruby-version + Gemfile.lock synchronized; see docs/releasing.md.
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
